name: Forward traffic research
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/traffic-forward-research.yml'
      - 'scripts/prospective_statsforecast.py'
      - 'scripts/statsforecast_traffic.py'
      - 'scripts/requirements-statsforecast.txt'
      - 'public/research/statsforecast-study.json'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traffic-forward-research
  cancel-in-progress: false
jobs:
  experiment:
    # Only the deployment's primary repository runs the public-data experiment.
    if: github.repository == 'kunalchwdry/tbo-assemble'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned research dependencies
        run: python -m pip install -r scripts/requirements-statsforecast.txt
      - name: Open separate research archive
        run: |
          git fetch origin refs/heads/traffic-research-history:refs/remotes/origin/traffic-research-history
          git worktree add --detach "$RUNNER_TEMP/traffic-research-history" refs/remotes/origin/traffic-research-history
      - name: Capture public data and freeze eligible forecasts
        env:
          OPENBLAS_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '1'
        run: python scripts/prospective_statsforecast.py --state-dir "$RUNNER_TEMP/traffic-research-history"
      - name: Append updated research state
        run: |
          cd "$RUNNER_TEMP/traffic-research-history"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record public traffic research snapshot'
            git push origin HEAD:refs/heads/traffic-research-history
          fi
      - name: Report source and model failures
        run: |
          python -c 'import json,os,sys; p=os.path.join(os.environ["RUNNER_TEMP"],"traffic-research-history","summary.json"); statuses=json.load(open(p))["lastRun"]["statuses"]; errors={"source-error","fit-failed","invalid-model-output"}; bad={k:v for k,v in statuses.items() if v in errors}; print("Collection or model failures:",bad); sys.exit(bool(bad))'
